# Fast tests on every push and pull request (default pytest selection: `-m "not slow"`, see pytest.ini).
# Note: most data-driven tests (registry, runreader, spectra, derive, integrity) SKIP here because the
# simulation outputs under data/ are gitignored; this job covers the code-level tests.
# No lint / type-check step: no linter or type checker is configured in this repo yet.
name: tests

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest   # not in requirements.txt yet
      - name: Fast tests
        run: python -m pytest -q -rs
