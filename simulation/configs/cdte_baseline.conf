[Allpix]
log_level = "INFO"
number_of_events = 5000
detectors_file = "/data/simulation/configs/detector_cdte.conf"
random_seed = 42
output_directory = "/data/output"

[GeometryBuilderGeant4]
world_material = "air"

[DepositionGeant4]
physics_list = QGSP_BERT
particle_type = "gamma"
source_energy = 60keV
source_type = "beam"
beam_size = 1mm
beam_direction = 0 0 1
source_position = 0 0 -1cm
number_of_particles = 1

[ElectricFieldReader]
model = "linear"
bias_voltage = -500V
depletion_voltage = -300V

[GenericPropagation]
temperature = 293K
charge_per_step = 10
lifetime_electrons = 3us
lifetime_holes = 0.5us

[SimpleTransfer]
max_depth_distance = 5um

[DefaultDigitizer]
threshold = 2000e
threshold_smearing = 30e
electronics_noise = 300e

[DetectorHistogrammer]
