[Allpix]
log_level = "INFO"
number_of_events = 10000
detectors_file = "/data/simulation/configs/detector_medipix3_exact.conf"
random_seed = 42
output_file = "medipix3_si_v2"

[GeometryBuilderGeant4]
world_material = "Si"

[DepositionGeant4]
physics_list = QGSP_BERT
particle_type = "gamma"
source_energy = 60keV
source_type = "beam"
beam_size = 1mm
beam_direction = 0 0 1
source_position = 0 0 -1cm
number_of_particles = 1

[ElectricFieldReader]
model = "linear"
bias_voltage = -100V
depletion_voltage = -50V

[GenericPropagation]
temperature = 293K
charge_per_step = 10
mobility_model = "jacoboni"

[SimpleTransfer]
max_depth_distance = 5um

[DefaultDigitizer]
electronics_noise = 80e
threshold = 700e
threshold_smearing = 35e

[DetectorHistogrammer]
output_plots = 1
