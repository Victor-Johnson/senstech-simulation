[Allpix]
log_level = "WARNING"
number_of_events = 10000
detectors_file = "/data/simulation/configs/scenarios/phase2_selection/detector_medipix3_bare_cdteh.conf"
random_seed = 42

[GeometryBuilderGeant4]
world_material = "air"
world_minimum_margin = 10mm 10mm 20mm

[DepositionGeant4]
physics_list = QGSP_BERT
particle_type = "gamma"
source_energy = 100keV
source_type = "beam"
beam_size = 1mm
beam_direction = 0 0 1
source_position = 0 0 -10mm
number_of_particles = 1

[ElectricFieldReader]
model = "linear"
bias_voltage = -500V
depletion_voltage = -300V

[GenericPropagation]
temperature = 293K
charge_per_step = 10
mobility_model = "constant"
mobility_electron = 1100cm*cm/V/s
mobility_hole = 100cm*cm/V/s
propagate_electrons = true
propagate_holes = true
trapping_model = "constant"
trapping_time_electron = 3000ns
trapping_time_hole = 500ns

[SimpleTransfer]
max_depth_distance = 5um

[DefaultDigitizer]
electronics_noise = 80e
threshold = 700e
threshold_smearing = 80e

[DetectorHistogrammer]
