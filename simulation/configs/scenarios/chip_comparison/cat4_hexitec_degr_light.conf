[Allpix]
log_level = "WARNING"
number_of_events = 10000
detectors_file = "/data/simulation/configs/scenarios/chip_comparison/detector_hexitec.conf"
random_seed = 42

[GeometryBuilderGeant4]
world_material = "air"

[DepositionGeant4]
physics_list = QGSP_BERT
particle_type = "gamma"
source_energy = 60keV
source_type = "beam"
beam_size = 1mm
beam_direction = 0 0 1
source_position = 0 0 -1cm
number_of_particles = 1

[ElectricFieldReader]
model = "linear"
bias_voltage = -500V
depletion_voltage = -300V

[GenericPropagation]
temperature = 293K
charge_per_step = 10
mobility_model = "jacoboni"
trapping_model = "constant"
trapping_time_electron = 10ns
trapping_time_hole = 10ns

[SimpleTransfer]
max_depth_distance = 5um

[DefaultDigitizer]
electronics_noise = 20e
threshold = 795e
threshold_smearing = 20e

[DetectorHistogrammer]
