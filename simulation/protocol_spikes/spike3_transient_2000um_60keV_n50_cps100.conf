[Allpix]
log_level = "WARNING"
number_of_events = 50
detectors_file = "/data/simulation/protocol_spikes/detector_linda_2000um.conf"
random_seed = 11
output_directory = "/data/output/protocol_spikes"
root_file = "spike3_transient_2000um_60keV_n50_cps100_modules"

[GeometryBuilderGeant4]
world_material = "air"

[DepositionGeant4]
physics_list = QGSP_BERT_LIV
particle_type = "gamma"
source_energy = 60keV
source_type = "beam"
beam_size = 0.3mm
beam_direction = 0 0 1
source_position = 0 0 -10mm
number_of_particles = 1

[ElectricFieldReader]
model = "constant"
bias_voltage = -1000V

[WeightingPotentialReader]
model = "pad"

[TransientPropagation]
temperature = 293K
charge_per_step = 100
timestep = 0.5ns
integration_time = 1us
mobility_model = "constant"
mobility_electron = 1090cm*cm/V/s
mobility_hole = 110cm*cm/V/s
trapping_model = "constant"
trapping_time_electron = 2480ns
trapping_time_hole = 1640ns
distance = 1

[PulseTransfer]

[TextWriter]
file_name = "spike3_transient_2000um_60keV_n50_cps100"
include = "PixelCharge"
