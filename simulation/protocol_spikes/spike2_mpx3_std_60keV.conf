[Allpix]
log_level = "WARNING"
number_of_events = 10000
detectors_file = "/data/simulation/protocol_spikes/detector_mpx3_patch_spike.conf"
random_seed = 7
output_directory = "/data/output/protocol_spikes"
root_file = "spike2_mpx3_std_60keV_modules"

[GeometryBuilderGeant4]
world_material = "air"

[DepositionGeant4]
physics_list = QGSP_BERT

particle_type = "gamma"
source_energy = 60keV
source_type = "beam"
beam_size = 0.3mm
beam_direction = 0 0 1
source_position = 0 0 -10mm
number_of_particles = 1

[ElectricFieldReader]
model = "linear"
bias_voltage = -500V
depletion_voltage = -300V

[GenericPropagation]
temperature = 293K
charge_per_step = 10
mobility_model = "constant"
mobility_electron = 1090cm*cm/V/s
mobility_hole = 110cm*cm/V/s
trapping_model = "constant"
trapping_time_electron = 2480ns
trapping_time_hole = 1640ns

[SimpleTransfer]
max_depth_distance = 5um

[TextWriter]
file_name = "spike2_mpx3_std_60keV"
include = "PixelCharge"
