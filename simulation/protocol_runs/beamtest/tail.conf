[ElectricFieldReader]
# PH-16 (decision, A): constant field for a fully depleted CdTe sensor
model = "constant"
bias_voltage = -500V

[GenericPropagation]
temperature = 293K
charge_per_step = 10
# PH-12: integration_time >= 1.5 x slowest drift (validated before run)
integration_time = 1us
propagate_holes = false
mobility_model = "constant"
mobility_electron = 1090cm*cm/V/s
mobility_hole = 110cm*cm/V/s
trapping_model = "constant"
trapping_time_electron = 2477ns
trapping_time_hole = 1636ns

[SimpleTransfer]
max_depth_distance = 5um

[DetectorHistogrammer]

[TextWriter]
file_name = "bt"
include = "PixelCharge"

[ROOTObjectWriter]
file_name = "bt_objects"
include = "MCTrack"
