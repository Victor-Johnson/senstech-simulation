[Allpix]
log_level = "WARNING"
number_of_events = 20000
detectors_file = "/data/simulation/protocol_runs/stageB/detector_medipix3.conf"
random_seed = 101
output_directory = "/data/output/protocol_runs/stageB/milestone1"
root_file = "pr_milestone1_medipix3_70keV_modules"

[GeometryBuilderGeant4]
world_material = "air"

[DepositionGeant4]
# PH-09: QGSP_BERT_LIV, Allpix default range cut
physics_list = QGSP_BERT_LIV
record_all_tracks = true
# Uniform flat beam over the fiducial square + margin (GPS macro); scoring by primary entry point
source_type = "macro"
file_name = "/data/simulation/protocol_runs/stageB/milestone1/pr_milestone1_medipix3_70keV.mac"
number_of_particles = 1
# PH-05 / PH-19: pair creation energy and Fano factor set explicitly
charge_creation_energy = 4.43eV
fano_factor = 0.24

[ElectricFieldReader]
# PH-16 (decision, A): constant field for a fully depleted CdTe sensor
model = "constant"
bias_voltage = -500V

[GenericPropagation]
charge_per_step = 10
propagate_holes = false
temperature = 293K
# PH-12: integration_time >= 1.5 x slowest drift (validated before run)
integration_time = 1us
mobility_model = "constant"
mobility_electron = 1090cm*cm/V/s
mobility_hole = 110cm*cm/V/s
trapping_model = "constant"
trapping_time_electron = 2477ns
trapping_time_hole = 1636.4ns

[SimpleTransfer]
max_depth_distance = 5um

[DetectorHistogrammer]

[TextWriter]
file_name = "pr_milestone1_medipix3_70keV"
include = "PixelCharge"

[ROOTObjectWriter]
file_name = "pr_milestone1_medipix3_70keV_objects"
include = "MCTrack"
