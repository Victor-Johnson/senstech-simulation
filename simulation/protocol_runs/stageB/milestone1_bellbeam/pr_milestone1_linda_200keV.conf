[Allpix]
log_level = "WARNING"
number_of_events = 20000
detectors_file = "/data/simulation/protocol_runs/stageB/detector_linda.conf"
random_seed = 101
output_directory = "/data/output/protocol_runs/stageB/milestone1"
root_file = "pr_milestone1_linda_200keV_modules"

[GeometryBuilderGeant4]
world_material = "air"

[DepositionGeant4]
# PH-09: QGSP_BERT_LIV, Allpix default range cut
physics_list = QGSP_BERT_LIV
record_all_tracks = true
particle_type = "gamma"
source_energy = 200keV
source_type = "beam"
beam_shape = "rectangle"
beam_size = 1320um 1320um
beam_direction = 0 0 1
source_position = 0 0 -10mm
number_of_particles = 1

[ElectricFieldReader]
# PH-16 (decision, A): constant field for a fully depleted CdTe sensor
model = "constant"
bias_voltage = -500V

[GenericPropagation]
temperature = 293K
charge_per_step = 10
# PH-12: integration_time >= 1.5 x slowest drift (validated before run)
integration_time = 1us
propagate_holes = false
mobility_model = "constant"
mobility_electron = 1090cm*cm/V/s
mobility_hole = 110cm*cm/V/s
trapping_model = "constant"
trapping_time_electron = 2477ns
trapping_time_hole = 1636ns

[SimpleTransfer]
max_depth_distance = 5um

[DetectorHistogrammer]

[TextWriter]
file_name = "pr_milestone1_linda_200keV"
include = "PixelCharge"

[ROOTObjectWriter]
file_name = "pr_milestone1_linda_200keV_objects"
include = "MCTrack"
