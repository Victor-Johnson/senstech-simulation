[Allpix]
log_level = "WARNING"
number_of_events = 2000
detectors_file = "/data/simulation/protocol_runs/drift/detector_linda_spike.conf"
random_seed = 1
output_directory = "/data/output/protocol_runs/drift"
root_file = "mctrack_60keV_modules"

[GeometryBuilderGeant4]
world_material = "air"

[DepositionGeant4]
record_all_tracks = true
physics_list = QGSP_BERT
particle_type = "gamma"
source_energy = 60keV
source_type = "beam"
beam_size = 0.3mm
beam_direction = 0 0 1
source_position = 0 0 -10mm
number_of_particles = 1

[ElectricFieldReader]
model = "constant"
bias_voltage = -300V

[GenericPropagation]
temperature = 293K
charge_per_step = 10
integration_time = 1us
mobility_model = "constant"
mobility_electron = 1090cm*cm/V/s
mobility_hole = 110cm*cm/V/s
trapping_model = "constant"
trapping_time_electron = 2480ns
trapping_time_hole = 1640ns
propagate_holes = true

[SimpleTransfer]
max_depth_distance = 5um

[TextWriter]
file_name = "mctrack_60keV"
include = "PixelCharge"

[ROOTObjectWriter]
file_name = "mctrack_60keV_objects"
include = "MCTrack"
