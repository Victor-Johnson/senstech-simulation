# Sensor-only model for the 70 keV backscatter check (ROADMAP open issue 1): the same sensor as the
# Stage B "medipix3" detector (Allpix "medipix3" model: pixel geometry, 1 mm sensor_excess guard region),
# but NO bump bonds, NO readout chip and NO support PCB behind the sensor.
type = "monolithic"
geometry = "pixel"
number_of_pixels = 64 64
pixel_size = 55um 55um
sensor_thickness = 1000um
sensor_excess = 1mm
sensor_material = "cadmium_telluride"
